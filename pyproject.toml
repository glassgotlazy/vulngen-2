[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vulngen"
version = "4.0.0"
description = "Reproducible framework for assessing security in code via SAST ensemble + manual adjudication"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anuansh Tiwari"}]
keywords = ["security", "static-analysis", "llm", "cwe", "sast", "reproducibility"]
dependencies = []   # core runs on the standard library only

[project.optional-dependencies]
sast = ["bandit", "semgrep"]      # optional external detectors
test = ["pytest"]

[project.scripts]
vulngen = "vulngen.cli:main"

[project.urls]
Homepage = "https://github.com/glassgotlazy/vulngen"

[tool.setuptools.packages.find]
include = ["vulngen*", "securebench*"]
